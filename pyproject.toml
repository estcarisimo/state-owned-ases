[project]
name = "state-owned-ases"
version = "2.0.0"
description = "Archival dataset of ASes operated by state-owned Internet operators (IMC 2021), with tooling to validate it and export it to CSV, TSV, JSON, Parquet, SQLite and compressed formats"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE-CODE"]
authors = [{ name = "Esteban Carisimo" }]
keywords = ["internet-measurement", "autonomous-systems", "state-owned-enterprises", "dataset", "bgp"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyarrow>=17.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "zstandard>=0.23",
]

[project.urls]
Homepage = "https://github.com/estcarisimo/state-owned-ases"
Documentation = "https://estcarisimo.github.io/state-owned-ases/"
Paper = "https://doi.org/10.1145/3487552.3487822"

[project.scripts]
state-owned-ases = "state_owned_ases.cli:app"

[dependency-groups]
dev = [
    "duckdb>=1.1",
    "mypy>=1.13",
    "pandas>=2.2",
    "pandas-stubs",
    "pre-commit>=4.0",
    "pyarrow-stubs",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = [
    "B008",  # typer.Option(...) defaults are the documented Typer pattern
]

[tool.ruff.lint.isort]
known-first-party = ["state_owned_ases"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["zstandard.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "behavior: pins current behavior (golden values, file layout)",
    "math: compares against an independent computation of the same quantity",
]

[tool.coverage.run]
source = ["src/state_owned_ases"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
